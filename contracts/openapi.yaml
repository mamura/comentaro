openapi: 3.1.0
info:
  title: Comentaro API
  version: 0.1.0
  description: Contrato HTTP entre a API Laravel e a aplicação web.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
security: []
servers:
  - url: /api/v1
    description: Ambiente local
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica se a API está disponível
      tags: [System]
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: comentaro-api
        version:
          type: string
          examples: [0.1.0]
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: [string, 'null']
        errors:
          type: [object, 'null']
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
