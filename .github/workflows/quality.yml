name: Quality

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comentaro_test
          POSTGRES_USER: comentaro
          POSTGRES_PASSWORD: comentaro
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U comentaro -d comentaro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
        env: &database
          DB_HOST: 127.0.0.1
          DB_DATABASE: comentaro_test
          DB_USERNAME: comentaro
          DB_PASSWORD: comentaro
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          composer test 2>&1 | tee /tmp/backend-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 60 /tmp/backend-tests.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Backend test failure::$message"
          fi
          exit "$status"
        env: *database
      - run: composer lint
      - run: composer analyse

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run api:lint
      - run: npm run api:generate
      - run: git diff --exit-code src/api/schema.d.ts
      - run: npm run check
      - run: npm run test
      - run: npm run build
